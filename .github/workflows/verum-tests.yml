name: VERUM quality gates

on:
  push:
    paths:
      - 'platform/**'
      - 'tests/test_repo.py'
      - '.github/workflows/verum-tests.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'tests/test_repo.py'
      - '.github/workflows/verum-tests.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: pip install -r platform/api/requirements.txt
      - name: Run original 13-skill regression suite
        run: python -m unittest discover -s tests -v
      - name: Run VERUM quant tests
        working-directory: platform/api
        run: python -m unittest discover -s tests -v
      - name: Compile API modules
        working-directory: platform/api
        run: python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm install
      - name: Type-check and build mobile application
        working-directory: platform/frontend
        run: npm run build
